<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Academy: Zero Delay</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }

        #scene {
            width: 100%;
            height: 100%;
            background-image: url('background.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            display: block;
        }

        #clock-display {
            position: absolute;
            bottom: 29.5%; 
            right: 22.5%;  
            width: 22%;    
            height: 10%;    
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial Narrow', 'Impact', sans-serif; 
            color: #ff0000;
            font-weight: 900;
            font-size: 5.5vw; 
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(255, 0, 0, 1), 0 0 25px rgba(255, 0, 0, 0.6);
            transform: skewX(-10deg) rotate(-0.5deg); 
            letter-spacing: -1px;
            white-space: nowrap;
            opacity: 0.95;
            animation: pulse 0.1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.85; text-shadow: 0 0 12px rgba(255, 0, 0, 1); }
            to { opacity: 1; text-shadow: 0 0 18px rgba(255, 0, 0, 1), 0 0 3px white; }
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 999;
            text-align: center;
        }

        .scary-text {
            color: white;
            text-transform: uppercase;
            font-size: 4rem;
            padding: 40px;
            word-wrap: break-word;
            max-width: 90%;
        }

        .font-style-0 { font-family: 'Courier New', monospace; color: #ff0000; letter-spacing: 2px; font-size: 2.5rem; }
        .font-style-1 { font-family: 'Times New Roman', serif; font-style: italic; }
        .font-style-2 { font-family: 'Arial Black', sans-serif; letter-spacing: -3px; }
        .font-style-3 { font-family: 'Impact', sans-serif; transform: scaleY(1.5); }
        .font-style-4 { font-family: 'Verdana', sans-serif; text-shadow: 0 0 15px red; color: white; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="fon.mp3" type="audio/mpeg">
    </audio>

    <div id="scene">
        <div id="clock-display">88:88</div>
    </div>

    <div id="overlay">
        <div id="message" class="scary-text"></div>
    </div>

    <script>
        const clockDisplay = document.getElementById('clock-display');
        const scene = document.getElementById('scene');
        const overlay = document.getElementById('overlay');
        const messageDisplay = document.getElementById('message');
        const audio = document.getElementById('bgMusic');
        
        // Автозапуск музыки при первом клике пользователя
        function startAudio() {
            audio.play().catch(err => console.log("Браузер ожидает клика..."));
            document.removeEventListener('mousedown', startAudio);
            document.removeEventListener('touchstart', startAudio);
            document.removeEventListener('keydown', startAudio);
        }
        document.addEventListener('mousedown', startAudio);
        document.addEventListener('touchstart', startAudio);
        document.addEventListener('keydown', startAudio);

        const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const phrases = [
            "RUN",
            "you shouldn't be here",
            "it's not what you think",
            "THE ACADEMY IS DANGEROUS",
            "I'm sorry",
            "nz1Tay2nf13fpTGYTpzVfnQ+QGZIDdlMFZ/f9eF5mD9dj8PiAYC4UReMqSkQU9qHupRxUCfnlC5B16pnuGjifg=="
        ];

        setInterval(() => {
            let res = "";
            for (let i = 0; i < 4; i++) {
                res += chars.charAt(Math.floor(Math.random() * chars.length));
                if (i === 1) res += ":"; 
            }
            clockDisplay.innerText = res;
        }, 120);

        function showScaryEvent() {
            const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
            const randomStyle = "font-style-" + Math.floor(Math.random() * 5);

            messageDisplay.innerText = randomPhrase;
            
            if (randomPhrase.length > 50) {
                messageDisplay.style.fontSize = "1.5rem";
                messageDisplay.style.wordBreak = "break-all";
            } else {
                messageDisplay.style.fontSize = ""; 
                messageDisplay.style.wordBreak = "";
            }

            messageDisplay.className = "scary-text " + randomStyle;
            scene.style.display = "none";
            overlay.style.display = "flex";

            setTimeout(() => {
                overlay.style.display = "none";
                scene.style.display = "block";
            }, 5000);
        }

        setInterval(showScaryEvent, 60000);
        setTimeout(showScaryEvent, 5000);
    </script>
</body>
</html>
