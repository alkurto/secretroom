<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Academy: Zero Delay</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: black;
        }

        #scene {
            width: 100%; height: 100%;
            background-image: url('background.png'); 
            background-size: cover; background-position: center;
            position: relative; display: block;
        }

        #clock-display {
            position: absolute;
            bottom: 29.5%; right: 22.5%; width: 22%; height: 10%;    
            display: flex; justify-content: center; align-items: center;
            font-family: 'Arial Narrow', 'Impact', sans-serif; 
            color: #ff0000; font-weight: 900; font-size: 5.5vw; 
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(255, 0, 0, 1);
            transform: skewX(-10deg) rotate(-0.5deg); 
            letter-spacing: 5px; opacity: 0.95;
        }

        .active-clock { animation: pulse 0.1s infinite alternate; }

        @keyframes pulse {
            from { opacity: 0.85; text-shadow: 0 0 12px red; }
            to { opacity: 1; text-shadow: 0 0 18px red, 0 0 3px white; }
        }

        /* ЭФФЕКТ БЕЛОГО ШУМА */
        #noise-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10000; display: none; pointer-events: none;
            background: url('https://media.giphy.com/media/oEI9uWU0EB9LpL6SAs/giphy.gif'); /* Ссылка на гифку шума */
            opacity: 0.3;
        }

        #boot-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }

        #start-btn {
            padding: 20px 40px; background: transparent; color: #ff0000;
            border: 2px solid #ff0000; font-family: 'Impact', sans-serif;
            font-size: 1.5rem; cursor: pointer; text-transform: uppercase;
        }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; display: none; justify-content: center;
            align-items: center; z-index: 999; text-align: center;
        }

        .scary-text { color: white; font-size: 4rem; text-transform: uppercase; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="fon.mp3" type="audio/mpeg">
    </audio>

    <div id="noise-overlay"></div>

    <div id="boot-overlay">
        <button id="start-btn">ENABLE SYSTEM CLOCK</button>
    </div>

    <div id="scene">
        <div id="clock-display"><span id="c1">-</span><span id="c2">-</span>:<span id="c3">-</span><span id="c4">-</span></div>
    </div>

    <div id="overlay">
        <div id="message" class="scary-text"></div>
    </div>

    <script>
        const clockSpans = [
            document.getElementById('c1'),
            document.getElementById('c2'),
            document.getElementById('c3'),
            document.getElementById('c4')
        ];
        const audio = document.getElementById('bgMusic');
        const bootOverlay = document.getElementById('boot-overlay');
        const noise = document.getElementById('noise-overlay');
        const clockContainer = document.getElementById('clock-display');
        
        let isSystemActive = false;
        let activeIndices = []; // Индексы цифр, которые уже «проснулись»

        document.getElementById('start-btn').addEventListener('click', () => {
            // 1. Показываем белый шум
            noise.style.display = 'block';
            
            setTimeout(() => {
                // 2. Убираем шум и оверлей, запускаем музыку
                noise.style.display = 'none';
                bootOverlay.style.display = 'none';
                audio.play();
                
                // 3. Появление цифр в порядке: 1, 3, 2, 4
                // Индексы массива: 0 (первая), 2 (третья), 1 (вторая), 3 (четвертая)
                const order = [0, 2, 1, 3];
                order.forEach((pos, i) => {
                    setTimeout(() => {
                        activeIndices.push(pos);
                        if (activeIndices.length === 4) {
                            isSystemActive = true;
                            clockContainer.classList.add('active-clock');
                        }
                    }, i * 400); // Интервал появления каждой цифры
                });
            }, 500); // Длительность белого шума
        });

        const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        
        // Цикл обновления цифр
        setInterval(() => {
            // Обновляем только те цифры, которые уже «активированы»
            activeIndices.forEach(idx => {
                clockSpans[idx].innerText = chars.charAt(Math.floor(Math.random() * chars.length));
            });
        }, 120);

        // Функция скримеров (сокращенная версия для чистоты кода)
        function showScaryEvent() {
            if (!isSystemActive) return;
            const phrases = ["RUN", "I'M WATCHING", "SYSTEM ERROR"];
            document.getElementById('message').innerText = phrases[Math.floor(Math.random() * phrases.length)];
            document.getElementById('scene').style.display = "none";
            document.getElementById('overlay').style.display = "flex";
            setTimeout(() => {
                document.getElementById('overlay').style.display = "none";
                document.getElementById('scene').style.display = "block";
            }, 3000);
        }

        setInterval(showScaryEvent, 60000);
    </script>
</body>
</html>
