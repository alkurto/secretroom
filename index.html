<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Academy: Zero Delay</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }

        /* Задний фон виден сразу */
        #scene {
            width: 100%;
            height: 100%;
            background-image: url('background.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            display: block;
        }

        /* Циферблат */
        #clock-display {
            position: absolute;
            bottom: 29.5%; 
            right: 22.5%;  
            width: 22%;    
            height: 10%;    
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial Narrow', 'Impact', sans-serif; 
            color: #ff0000;
            font-weight: 900;
            font-size: 5.5vw; 
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(255, 0, 0, 1), 0 0 25px rgba(255, 0, 0, 0.6);
            transform: skewX(-10deg) rotate(-0.5deg); 
            letter-spacing: -1px;
            white-space: nowrap;
            opacity: 0.95;
        }

        /* Анимация пульсации (добавим её позже через JS) */
        .active-clock {
            animation: pulse 0.1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.85; text-shadow: 0 0 12px rgba(255, 0, 0, 1); }
            to { opacity: 1; text-shadow: 0 0 18px rgba(255, 0, 0, 1), 0 0 3px white; }
        }

        /* Стартовый экран поверх всего */
        #boot-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* Полупрозрачный, чтобы видеть фон */
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: 0.5s;
        }

        #start-btn {
            padding: 20px 40px;
            background: transparent;
            color: #ff0000;
            border: 2px solid #ff0000;
            font-family: 'Impact', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 3px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
            transition: 0.3s;
        }

        #start-btn:hover {
            background: #ff0000;
            color: black;
            box-shadow: 0 0 30px #ff0000;
        }

        /* Эффект глитча при активации */
        .glitch-flash {
            animation: flash 0.2s steps(2) infinite;
        }

        @keyframes flash {
            0% { background: white; opacity: 0.8; transform: translate(5px, -5px); }
            50% { background: red; opacity: 0.5; transform: translate(-5px, 5px); }
            100% { background: transparent; }
        }

        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: black;
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 999;
            text-align: center;
        }

        .scary-text {
            color: white;
            text-transform: uppercase;
            font-size: 4rem;
            padding: 40px;
            word-wrap: break-word; 
            max-width: 90%;
        }

        .font-style-0 { font-family: 'Courier New', monospace; color: #ff0000; letter-spacing: 2px; font-size: 2.5rem; }
        .font-style-1 { font-family: 'Times New Roman', serif; font-style: italic; }
        .font-style-2 { font-family: 'Arial Black', sans-serif; letter-spacing: -3px; }
        .font-style-3 { font-family: 'Impact', sans-serif; transform: scaleY(1.5); }
        .font-style-4 { font-family: 'Verdana', sans-serif; text-shadow: 0 0 15px red; color: white; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="fon.mp3" type="audio/mpeg">
    </audio>

    <div id="boot-overlay">
        <button id="start-btn">ENABLE SYSTEM CLOCK</button>
    </div>

    <div id="scene">
        <div id="clock-display">--:--</div>
    </div>

    <div id="overlay">
        <div id="message" class="scary-text"></div>
    </div>

    <script>
        const clockDisplay = document.getElementById('clock-display');
        const scene = document.getElementById('scene');
        const overlay = document.getElementById('overlay');
        const messageDisplay = document.getElementById('message');
        const audio = document.getElementById('bgMusic');
        const bootOverlay = document.getElementById('boot-overlay');
        const startBtn = document.getElementById('start-btn');

        let isSystemActive = false;

        startBtn.addEventListener('click', () => {
            // Создаем глитч эффект
            bootOverlay.classList.add('glitch-flash');
            startBtn.style.display = 'none';

            setTimeout(() => {
                bootOverlay.style.display = 'none';
                audio.play();
                isSystemActive = true;
                clockDisplay.classList.add('active-clock');
                
                // Запускаем скримеры через 5 секунд после включения
                setTimeout(showScaryEvent, 5000);
            }, 600); // Длительность глитча
        });

        const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const phrases = [
            "RUN",
            "you shouldn't be here",
            "it's not what you think",
            "THE ACADEMY IS DANGEROUS",
            "I'm sorry",
            "nz1Tay2nf13fpTGYTpzVfnQ+QGZIDdlMFZ/f9eF5mD9dj8PiAYC4UReMqSkQU9qHupRxUCfnlC5B16pnuGjifg=="
        ];

        // Генерация кода на часах (только если система активна)
        setInterval(() => {
            if (!isSystemActive) return;

            let res = "";
            for (let i = 0; i < 4; i++) {
                res += chars.charAt(Math.floor(Math.random() * chars.length));
                if (i === 1) res += ":"; 
            }
            clockDisplay.innerText = res;
        }, 120);

        function showScaryEvent() {
            if (!isSystemActive) return;

            const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
            const randomStyle = "font-style-" + Math.floor(Math.random() * 5);

            messageDisplay.innerText = randomPhrase;
            
            if (randomPhrase.length > 50) {
                messageDisplay.style.fontSize = "1.5rem";
                messageDisplay.style.wordBreak = "break-all";
            } else {
                messageDisplay.style.fontSize = ""; 
                messageDisplay.style.wordBreak = "";
            }

            messageDisplay.className = "scary-text " + randomStyle;
            scene.style.display = "none";
            overlay.style.display = "flex";

            setTimeout(() => {
                overlay.style.display = "none";
                scene.style.display = "block";
            }, 5000);
        }

        // Интервал появления скримеров
        setInterval(showScaryEvent, 60000);
    </script>
</body>
</html>
